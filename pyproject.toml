[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-edge-lab"
version = "0.2.0"
description = "Local telemetry and device control for the personal edge lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "httpx>=0.27,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "pytest>=8,<9",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_edge_lab"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

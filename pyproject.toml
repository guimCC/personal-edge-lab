[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-edge-lab"
version = "0.10.0"
description = "Local telemetry and device control for the personal edge lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "httpx>=0.27,<1",
  "pydantic>=2.13,<3",
  "pwdlib[argon2]>=0.3,<0.4",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "httpx2>=2.9,<3",
  "pyright>=1.1.400,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5",
  "shellcheck-py>=0.10,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_edge_lab"]

[tool.hatch.build.targets.wheel.force-include]
"src/personal_edge_lab/apps/api/static/dashboard" = "personal_edge_lab/apps/api/static/dashboard"

[tool.hatch.build.targets.sdist]
artifacts = ["src/personal_edge_lab/apps/api/static/dashboard"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = ["unoq_live: opt-in calls to the real UNO Q from RUBIK"]

[tool.coverage.run]
branch = true
source = ["personal_edge_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

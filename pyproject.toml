[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-edge-lab"
version = "0.1.0"
description = "Local telemetry collection for the personal edge lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["services/telemetry-collector/src/telemetry_collector"]

[tool.pytest.ini_options]
testpaths = ["services/telemetry-collector/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/telemetry-collector/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


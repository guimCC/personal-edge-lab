server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name rubik-edge-01.local;
    return 308 https://rubik-edge-01.local$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/personal-edge-lab/tls/rubik-edge-01.local.pem;
    ssl_certificate_key /etc/personal-edge-lab/tls/rubik-edge-01.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rubik-edge-01.local;

    ssl_certificate /etc/personal-edge-lab/tls/rubik-edge-01.local.pem;
    ssl_certificate_key /etc/personal-edge-lab/tls/rubik-edge-01.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PEL_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css;

    location = /health/live {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}

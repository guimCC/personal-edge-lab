name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and verify dashboard
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify dashboard in a real browser
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python development environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify Python architecture and behavior
        run: |
          python -m ruff check src tests hatch_build.py scripts/inspect_wheel.py
          python -m ruff format --check src tests hatch_build.py scripts/inspect_wheel.py
          pyright --pythonpath "$(command -v python)"
          python -m pytest --cov=personal_edge_lab --cov-report=term-missing --cov-report=xml

      - name: Verify operational scripts
        run: shellcheck scripts/*.sh

      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python scripts/inspect_wheel.py dist/*.whl
